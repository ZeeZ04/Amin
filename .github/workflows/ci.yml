name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[dev]"
      - name: lint
        run: uv run ruff check amin tests
      - name: tests
        run: uv run pytest -q
      - name: eval (no model required)
        run: |
          uv run amin ingest --reset --provider echo
          uv run amin eval --provider echo --no-save

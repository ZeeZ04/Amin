# Amin's covenant — the rules the system is held to.
# Edits here change behaviour and must be justified by a row in docs/EXPERIMENTS.md.
version: "1"

refusal_template: >-
  I don't have a source for that in my library, so I won't guess.
  Add a document that covers it and ask me again.

# Questions that must never be answered by synthesising from a document corpus.
# Amin may quote what a source says, but it must not turn that into advice, and
# it must always name who to actually ask. Rationale: the people using this
# trust it more than they trust a search engine precisely because it is
# home-built, which makes confident synthesis here the highest-harm failure.
#
# `patterns` are checked first: instant, and measured on the main eval set.
# When none match, the router (amin/classify.py) reads every `describe` as one
# option and scores them all in one forward pass, in any language. A route
# fires when its probability reaches `threshold`. self_harm sits lowest: a
# missed crisis costs far more than a referral nobody needed.
# `localized` is what the person reads when they wrote in that language.
routes:
  - name: medical
    patterns:
      - '\b(diagnos(?:e|ed|es|is|ing)|symptom\w*|prescri\w*|dosage|dose|mg\b)\b'
      - '\b(should|can|could|may) I take\b'
      - '\bis it safe to (take|use|give)\b'
      - '\b(treat(ment)?|cure|side ?effects?)\b.*\b(for|of)\b'
      - '\b(أعراض|تشخيص|جرعة|دواء)\b'
    message: >-
      I can quote what a document says, but I won't give medical advice or
      interpret symptoms — the cost of being subtly wrong is too high.
    refer_to: a pharmacist or doctor
    describe: asks for personal medical advice - a diagnosis, symptoms, a treatment, a medicine or a dose
    threshold: 0.6
    localized:
      ar: >-
        يمكنني أن أقتبس ما يقوله المستند، لكنني لا أقدّم نصيحة طبية ولا أفسّر الأعراض. يُرجى سؤال صيدلي أو طبيب.
      ml: >-
        രേഖയിൽ പറയുന്നത് ഉദ്ധരിക്കാം, പക്ഷേ ഞാൻ വൈദ്യോപദേശം നൽകുകയോ ലക്ഷണങ്ങൾ വ്യാഖ്യാനിക്കുകയോ ചെയ്യില്ല. ദയവായി ഒരു ഫാർമസിസ്റ്റിനോടോ ഡോക്ടറോടോ ചോദിക്കുക.

  - name: legal
    patterns:
      - '\b(am I liable|can I sue|is it legal|legally (required|obliged)|my rights under)\b'
      - '\b(visa|immigration|deport\w*|residency) .*(eligib\w*|qualify|apply for)\b'
      - '\b(هل يحق|قانوني|محكمة)\b'
    message: >-
      I'll show you the clause or regulation and quote it exactly, but I won't
      tell you what it means for your situation.
    refer_to: a lawyer or the issuing authority
    describe: asks for legal advice about their own situation - rights, liability, suing, or whether something is legal
    threshold: 0.6
    localized:
      ar: >-
        سأعرض لك البند أو اللائحة وأقتبسها كما هي، لكنني لن أقول ما تعنيه لحالتك. يُرجى سؤال محامٍ أو الجهة المصدرة.
      ml: >-
        ബന്ധപ്പെട്ട വ്യവസ്ഥ അതേപടി ഉദ്ധരിച്ച് കാണിക്കാം, പക്ഷേ അത് നിങ്ങളുടെ കാര്യത്തിൽ എന്താണ് അർത്ഥമാക്കുന്നതെന്ന് ഞാൻ പറയില്ല. ദയവായി ഒരു അഭിഭാഷകനോടോ ബന്ധപ്പെട്ട അധികാരികളോടോ ചോദിക്കുക.

  - name: financial
    patterns:
      - '\b(should I (buy|sell|invest)|is .* a good investment|will .* (go up|crash))\b'
      - '\b(stock|crypto|bitcoin|shares) .*(buy|sell|invest|price target)\b'
    message: >-
      I don't make investment calls. I can pull up the figures in your
      documents and leave the decision with you.
    refer_to: a licensed financial adviser
    describe: asks whether to buy, sell or invest in something, or where a price or market will go
    threshold: 0.6
    localized:
      ar: >-
        لا أتخذ قرارات استثمارية. يمكنني عرض الأرقام الواردة في مستنداتك وترك القرار لك. يُرجى سؤال مستشار مالي مرخّص.
      ml: >-
        നിക്ഷേപ തീരുമാനങ്ങൾ ഞാൻ എടുക്കില്ല. നിങ്ങളുടെ രേഖകളിലെ കണക്കുകൾ കാണിച്ചുതരാം, തീരുമാനം നിങ്ങളുടേതാണ്. ദയവായി ലൈസൻസുള്ള ഒരു സാമ്പത്തിക ഉപദേഷ്ടാവിനോട് ചോദിക്കുക.

  - name: self_harm
    patterns:
      - '\b(kill myself|end my life|suicid\w*|self[- ]harm|hurt myself)\b'
    message: >-
      This is not something I'm the right tool for, and I don't want to answer
      it from a document index.
    refer_to: >-
      someone you trust, or a local crisis line — in the UAE, the Estijaba
      helpline on 800 1717
    describe: talks about suicide, wanting to die, self-harm, or being in crisis or danger
    threshold: 0.3
    localized:
      ar: >-
        أنا لست الأداة المناسبة لهذا، ولا أريد أن أجيب عنه من مستندات. يُرجى التحدث إلى شخص تثق به، أو الاتصال بخط المساعدة: في الإمارات، خط استجابة على 800 1717.
      ml: >-
        ഇതിന് ഞാൻ ശരിയായ സഹായമല്ല. ദയവായി നിങ്ങൾ വിശ്വസിക്കുന്ന ഒരാളോട് സംസാരിക്കുക, അല്ലെങ്കിൽ ഒരു ഹെൽപ്‌ലൈനിൽ വിളിക്കുക: ഇന്ത്യയിൽ ടെലി-മനസ് 14416 (മലയാളത്തിലും ലഭ്യം), യുഎഇയിൽ എസ്തിജാബ 800 1717.

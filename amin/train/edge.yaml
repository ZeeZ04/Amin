# The on-device student (ADR-014): Gemma 4 E4B, LoRA on bf16, shipped at 4-bit.
# `uv run mlx_lm.lora -c amin/train/edge.yaml`. E31's recipe, new base and data.
model: data/models/gemma-4-e4b-it-bf16
train: true
data: data/train/edge
fine_tune_type: lora
adapter_path: data/adapters/edge-e4b-sft
seed: 0

mask_prompt: true
# Gemma's tokenizer fits a Malayalam grounded prompt in ~1,700 tokens (Qwen3: ~6,100).
max_seq_length: 3072
grad_checkpoint: true

batch_size: 4
iters: 2553            # 1 epoch of    10212 examples (E35)
learning_rate: 2.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-7
  arguments: [2.0e-5, 2553, 1.0e-6]
num_layers: -1
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05

steps_per_report: 20
steps_per_eval: 200
val_batches: 25
save_every: 200

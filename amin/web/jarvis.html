<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amin</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: "Noto Sans Malayalam"; src: url("/static/fonts/noto-sans-malayalam.woff2") format("woff2"); }
  :root {
    --bg-centre: #0A3F3C; --bg-edge: #062E2C; --vignette: #031A19;
    --sand: #F3EFE4; --text-2: #BFD6D2; --text-3: #9FC1BB;
    --lantern: #E3A72F; --glow: #FFE7AE; --speak: #8FD3C9; --chip: #0E5E5A;
    --panel: rgba(243, 239, 228, 0.06); --panel-line: rgba(243, 239, 228, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 45%, var(--bg-centre) 0, var(--bg-edge) 55%, var(--vignette) 100%);
    color: var(--sand);
    font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Malayalam", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh;
  }
  [lang="ml"], .ml { font-family: "Noto Sans Malayalam", system-ui, sans-serif; line-height: 1.75; }
  header { display: flex; align-items: center; gap: 18px; padding: 22px 32px; }
  #clock { font: 300 34px/1 ui-rounded, -apple-system, system-ui; font-variant-numeric: tabular-nums; opacity: .85; }
  #date { color: var(--text-3); font-size: 14px; }
  header .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
          background: var(--panel); border: 1px solid var(--panel-line); color: var(--text-2); font-size: 14px; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  .pill.live .dot { background: var(--lantern); box-shadow: 0 0 10px var(--lantern); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .icon-btn { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px; padding: 8px 14px; color: var(--text-2); font-size: 14px; }
  .icon-btn[aria-pressed="true"] { background: var(--chip); color: var(--sand); }
  main { display: grid; grid-template-columns: 1fr minmax(260px, 340px); gap: 24px; padding: 0 32px; min-height: 0; }
  #stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-height: 0; }
  #orb { width: min(46vh, 440px); height: min(46vh, 440px); cursor: pointer; }
  #state { font-size: 24px; font-weight: 600; letter-spacing: .01em; }
  #said { color: var(--text-2); font-size: 20px; text-align: center; max-width: 820px; min-height: 1.5em; }
  #reply { font-family: ui-serif, "New York", Georgia, serif; font-size: 24px; line-height: 1.55; text-align: center;
           max-width: 860px; max-height: 26vh; overflow-y: auto; white-space: pre-wrap; }
  #reply.ml { font-family: "Noto Sans Malayalam", system-ui, sans-serif; line-height: 1.8; }
  aside { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; overflow-y: auto; min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; padding: 14px 16px; }
  .panel h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); font-weight: 600; }
  .src { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--panel-line); font-size: 15px; }
  .src:first-of-type { border-top: 0; }
  .src b { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 50%; background: rgba(227,167,47,.18); color: var(--glow); font-size: 13px; }
  .src span { color: var(--text-2); }
  .src small { display: block; color: var(--text-3); }
  #history .q { color: var(--text-2); font-size: 14px; padding: 6px 0; border-top: 1px solid var(--panel-line); }
  #history .q:first-of-type { border-top: 0; }
  footer { display: flex; align-items: center; gap: 12px; padding: 18px 32px 26px; }
  #type { flex: 1; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px; color: var(--sand);
          padding: 14px 20px; font: inherit; outline: none; }
  #type:focus { border-color: var(--lantern); }
  #type::placeholder { color: var(--text-3); }
  .hint { color: var(--text-3); font-size: 13px; }
  #gate { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: inherit; }
  #gate.show { display: grid; }
  #gate a { color: var(--glow); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div><div id="clock">--:--</div><div id="date"></div></div>
  <span class="pill" id="wakePill"><span class="dot"></span><span id="wakeText">Microphone off</span></span>
  <span class="spacer"></span>
  <span class="pill" id="where"><span class="dot"></span><span>On this computer · nothing leaves it</span></span>
  <button class="icon-btn" data-lang="auto" aria-pressed="true">Auto</button>
  <button class="icon-btn" data-lang="en" aria-pressed="false">EN</button>
  <button class="icon-btn" data-lang="ar" aria-pressed="false">ع</button>
  <button class="icon-btn ml" data-lang="ml" aria-pressed="false">മ</button>
  <button class="icon-btn" id="mute" aria-pressed="false">Voice on</button>
</header>
<main>
  <section id="stage">
    <canvas id="orb" width="880" height="880" role="button" aria-label="Amin. Click to talk."></canvas>
    <div id="state">Click the orb, or say “Hey Amin”</div>
    <div id="said"></div>
    <div id="reply" aria-live="polite"></div>
  </section>
  <aside>
    <div class="panel"><h2>Sources</h2><div id="sources"><span class="hint">Answers from your documents show their passages here.</span></div></div>
    <div class="panel"><h2>This conversation</h2><div id="history"><span class="hint">Nothing yet.</span></div></div>
  </aside>
</main>
<footer>
  <input id="type" placeholder="Or type to Amin, and press Enter" autocomplete="off">
  <span class="hint">Space to talk · Esc to stop</span>
</footer>
<div id="gate"><div><h1>Sign in to Amin first</h1><p><a href="/?then=jarvis">Open Amin and sign in</a>, then come back here.</p></div></div>
<script src="/static/jarvis.js"></script>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amin"
version = "0.1.0"
description = "A grounded, locally-run assistant that cites its sources and refuses when it cannot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.2"]
st = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]
# Post-training Amin's own model on Apple silicon. Not needed to run Amin.
train = [
  "mlx-lm>=0.32; python_version >= '3.11' and sys_platform == 'darwin'",
  "mlx-lm-lora>=5.8; python_version >= '3.11' and sys_platform == 'darwin'",
]

[project.scripts]
amin = "amin.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["amin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  "B008",  # typer.Option in defaults is the framework's own idiom
]
